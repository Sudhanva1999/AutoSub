[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autosub"
version = "1.0.0"
description = "Local English subtitle generation for video libraries (Parakeet TDT 0.6B v2)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mlx = ["parakeet-mlx"]
cpu = ["onnx-asr[cpu,hub]"]
cuda = ["onnx-asr[gpu,hub]", "onnxruntime-gpu[cuda,cudnn]"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
autosub = "autosub.cli:main"
autosub-ui = "autosub.web.server:main"

[tool.setuptools.packages.find]
include = ["autosub*"]

[tool.setuptools.package-data]
"autosub.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["SIM105"]
